<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Outer Shield Badge -->
  <path d="M256 64 C350 64 390 100 390 190 C390 320 280 400 256 430 C232 400 122 320 122 190 C122 100 162 64 256 64 Z" 
        fill="#ffffff" opacity="0.15" />
        
  <!-- Core Shield -->
  <path d="M256 80 C336 80 372 110 372 195 C372 305 275 375 256 405 C237 375 140 305 140 195 C140 110 176 80 256 80 Z" 
        fill="#0f172a" stroke="#38bdf8" stroke-width="8"/>
        
  <!-- Wave Ripples at Bottom -->
  <path d="M165 295 Q210 270 256 295 T347 295" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <path d="M185 330 Q220 310 256 330 T327 330" fill="none" stroke="#60a5fa" stroke-width="10" stroke-linecap="round"/>

  <!-- Rescue Ring / Shelter Icon -->
  <circle cx="256" cy="190" r="54" fill="none" stroke="url(#accent)" stroke-width="16"/>
  <path d="M256 150 L256 166 M256 214 L256 230 M216 190 L232 190 M280 190 L296 190" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Plus / Help Center Symbol in center -->
  <path d="M256 172 L256 208 M238 190 L274 190" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
</svg>
